services:
  - type: web
    name: akngroup-wellness-mlm
    env: node
    plan: standard
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: MEMBER_JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
